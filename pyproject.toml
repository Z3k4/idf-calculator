[project]
name = "idf-trains"
version = "0.1.0"
description = "API simplifiée des prochains trains (RER, Transilien, TER) d'une gare Île-de-France Mobilités"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idf_trains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
